[profile.default]
fs_permissions = [{ access = "read-write", path = "./deployments" }]
src = "src"
out = "out"
libs = ["lib"]
remappings = [
    "protocol-contracts/=./",
    "forge-std/=lib/forge-std/src/",
    "openzeppelin-contracts/=lib/openzeppelin-contracts/",
]
solc_version = "0.8.34"
memory_limit = 43554432
gas_limit = 9223372036854775807
gas_price = 0
optimizer = true
optimizer_runs = 10000
via_ir = true

[rpc_endpoints]
sepolia = "https://eth-sepolia.g.alchemy.com/v2/${ALCHEMY_KEY}"
mainnet = "https://eth-mainnet.g.alchemy.com/v2/${ALCHEMY_KEY}"
# Public endpoint: the configured Alchemy key has neither Base enabled nor capacity left.
base = "https://mainnet.base.org"

[etherscan]
sepolia = { key = "${ETHERSCAN_API_KEY}" }
mainnet = { key = "${ETHERSCAN_API_KEY}" }
# One Etherscan V2 key covers every chain; `chain` selects Basescan.
base = { key = "${ETHERSCAN_API_KEY}", chain = 8453 }
