[profile.default]
# Read access to the build output: the Yul helper (src/libs/tron/TronStakeOps.yul) has no artifact
# name vm.getCode can resolve, so its test loads the artifact by path.
fs_permissions = [
    { access = "read-write", path = "./deployments" },
    { access = "read", path = "./out" },
    { access = "read", path = "./out-tron" },
]
src = "src"
out = "out"
libs = ["lib"]
remappings = [
    "protocol-contracts/=./",
    "forge-std/=lib/forge-std/src/",
    "openzeppelin-contracts/=lib/openzeppelin-contracts/",
]
solc_version = "0.8.34"
memory_limit = 43554432
gas_limit = 9223372036854775807
gas_price = 0
optimizer = true
optimizer_runs = 10000
via_ir = true

# TRON. Same sources and settings, targeting the TVM: mainnet and Nile run PUSH0, TSTORE/TLOAD and
# MCOPY (probed 2026-11-07 by vault/tron `cli.mjs probe`), so cancun, as in the vault and guard repos.
# Its own output directory, so tron/deploy.mjs never reads an EVM artifact.
[profile.tron]
evm_version = "cancun"
out = "out-tron"

[rpc_endpoints]
sepolia = "https://eth-sepolia.g.alchemy.com/v2/${ALCHEMY_KEY}"
mainnet = "https://eth-mainnet.g.alchemy.com/v2/${ALCHEMY_KEY}"
# Public endpoint: the configured Alchemy key has neither Base enabled nor capacity left.
base = "https://mainnet.base.org"
arbitrum = "https://arb1.arbitrum.io/rpc"
# Robinhood Chain (Arbitrum Orbit L2, id 4663). The public endpoint is rate-limited; override with a
# dedicated provider for anything heavier than a deploy.
robinhood = "https://rpc.mainnet.chain.robinhood.com"
# BNB Smart Chain (56). Public endpoint: the configured Alchemy key does not have BNB enabled.
bsc = "https://bsc-dataseed.bnbchain.org"

[etherscan]
# Robinhood Chain has no entry here on purpose: forge refuses an [etherscan] entry for a chain id it
# does not know. Verify on Blockscout from the command line instead:
#   forge verify-contract --chain 4663 --verifier blockscout \
#     --verifier-url https://robinhoodchain.blockscout.com/api <address> <Contract>
sepolia = { key = "${ETHERSCAN_API_KEY}" }
mainnet = { key = "${ETHERSCAN_API_KEY}" }
# One Etherscan V2 key covers every chain; `chain` selects Basescan.
base = { key = "${ETHERSCAN_API_KEY}", chain = 8453 }
arbitrum = { key = "${ETHERSCAN_API_KEY}", chain = 42161 }
bsc = { key = "${ETHERSCAN_API_KEY}", chain = 56 }

# forge's build-time linter cannot parse Yul objects; the one Yul source is TRON's staking opcodes.
[lint]
ignore = ["src/libs/tron/TronStakeOps.yul"]
